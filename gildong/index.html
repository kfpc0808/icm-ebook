  function ensureCss(){
    if (document.getElementById('icm-css')) return;
    var st = document.createElement('style');
    st.id = 'icm-css';
    st.textContent = CSS;
    (document.head || document.documentElement).appendChild(st);
  }

  function el(tag, attrs, html){
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (html != null) e.innerHTML = html;
    return e;
  }

  var layer, fab, dim, sel, form, done, errBox, recap;

  function build(){

          '<div class="icm-fld"><label class="icm-lb" for="icm-tel">연락처</label><input class="icm-in" id="icm-tel" type="tel" maxlength="20" placeholder="010-0000-0000" autocomplete="tel"></div>' +

        '<div class="icm-fld"><label class="icm-lb" for="icm-comp">회사명 <i>(선택)</i></label><input class="icm-in" id="icm-comp" type="text" maxlength="40" placeholder="(주)대한산업" autocomplete="organization"></div>' +

        '<div class="icm-agree"><input id="icm-ok" type="checkbox"><label for="icm-ok">상담 연락을 위한 <b>개인정보 수집·이용</b>에 동의합니다. 수집 항목은 성명·연락처·회사명·문의내용이며, 상담 종료 후 지체 없이 파기합니다.</label></div>' +
        '<div class="icm-err" style="display:none"></div>' +
        '<button class="icm-go" id="icm-send" type="button">신청하기</button>' +

  /* ── 연락처 자동 하이픈 — 010-1234-5678 / 02-123-4567 / 031-123-4567 ── */
  function fmtTel(v){
    var d = String(v).replace(/\D/g,'').slice(0,11);
    if (d.indexOf('02') === 0){
      if (d.length <= 2) return d;
      if (d.length <= 5) return d.slice(0,2)+'-'+d.slice(2);
      if (d.length <= 9) return d.slice(0,2)+'-'+d.slice(2,d.length-4)+'-'+d.slice(-4);
      return d.slice(0,2)+'-'+d.slice(2,6)+'-'+d.slice(6,10);
    }
    if (d.length <= 3) return d;
    if (d.length <= 7) return d.slice(0,3)+'-'+d.slice(3);
    if (d.length <= 10) return d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6);
    return d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7);
  }

  /* ── 터치 처리 — 브로슈어 뷰어가 화면 전체의 터치를 가로채 클릭이 막히므로 직접 처리한다 ── */
  var lastTouch = 0;
  function bindTouch(root){
    var sx = 0, sy = 0, moved = false;
    ['touchstart','touchmove','touchend','pointerdown','pointerup','mousedown','mouseup','wheel'].forEach(function(ev){
      root.addEventListener(ev, function(e){ e.stopPropagation(); }, {passive:true});
    });
    root.addEventListener('touchstart', function(e){
      var t = e.touches[0]; sx = t.clientX; sy = t.clientY; moved = false;
    }, {passive:true});
    root.addEventListener('touchmove', function(e){
      var t = e.touches[0];
      if (Math.abs(t.clientX-sx) > 10 || Math.abs(t.clientY-sy) > 10) moved = true;
    }, {passive:true});
    root.addEventListener('touchend', function(e){
      if (moved) return;
      var tg = e.target;
      var btn = tg.closest ? tg.closest('button') : null;
      if (btn && root.contains(btn)){
        e.preventDefault(); lastTouch = Date.now();
        if (!btn.disabled && typeof btn.onclick === 'function') btn.onclick.call(btn, e);
        return;
      }
      var agree = tg.closest ? tg.closest('.icm-agree') : null;
      if (agree){
        e.preventDefault(); lastTouch = Date.now();
        var cb = agree.querySelector('input[type=checkbox]'); cb.checked = !cb.checked;
        return;
      }
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName)){
        if (document.activeElement !== tg){ tg.focus(); }
        return;
      }
      var lb = tg.closest ? tg.closest('label[for]') : null;
      if (lb){ var f = document.getElementById(lb.getAttribute('for')); if (f) f.focus(); }
    }, {passive:false});
    /* 터치 직후 따라오는 클릭은 한 번만 처리 */
    root.addEventListener('click', function(e){
      if (Date.now() - lastTouch < 700){ e.stopPropagation(); if (e.target.tagName==='BUTTON') e.preventDefault(); }
    }, true);
  }

  /* ── 휴대폰 자판이 입력칸을 가리지 않도록 — 보이는 영역에 맞춰 팝업을 줄이고 입력칸을 가운데로 ── */
  function bindKeyboard(modal){
    var vv = window.visualViewport;
    function fit(){
      if (!vv || dim.style.display === 'none') return;
      dim.style.top    = vv.offsetTop + 'px';
      dim.style.height = vv.height + 'px';
      dim.style.bottom = 'auto';
      modal.style.maxHeight = Math.max(240, vv.height - 12) + 'px';
    }
    if (vv){ vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit); }
    modal.addEventListener('focusin', function(e){
      var f = e.target;
      if (!/^(INPUT|TEXTAREA|SELECT)$/.test(f.tagName)) return;
      setTimeout(function(){ fit(); try{ f.scrollIntoView({block:'center', behavior:'smooth'}); }catch(_e){ f.scrollIntoView(); } }, 350);
    });
    modal.addEventListener('focusout', function(){ setTimeout(fit, 350); });
  }

  /* 주소에서 회원 아이디 — /shinje7377/ → shinje7377 */
  function memberId(){
    var seg = location.pathname.split('/').filter(Boolean);
    return seg.length ? decodeURIComponent(seg[seg.length-1]).replace(/\.html?$/i,'') : '';
  }
  var MID = memberId();

  /* 현재 펼친 페이지 번호 — 툴바 표시(6/16, 2-3/16)에서 읽는다 */
  function currentPages(){
    var els = document.querySelectorAll('input,div,span,b,p');
    for (var i=0;i<els.length;i++){
      var e = els[i];
      if (dim && dim.contains(e)) continue;
      if (e.tagName !== 'INPUT' && e.children && e.children.length) continue;
      var t = (e.value || e.textContent || '').replace(/\s+/g,'');
      if (!t || t.length > 12) continue;
      var m = t.match(/^(\d{1,3})[-~](\d{1,3})\/\d{1,3}$/);
      if (m) return [ +m[1], +m[2] ];
      m = t.match(/^(\d{1,3})\/\d{1,3}$/);
      if (m) return [ +m[1] ];
    }
    var h = (location.hash||'').match(/p=(\d+)/);
    return h ? [ +h[1] ] : null;
  }

  /* 페이지 번호에 해당하는 페이지 이미지의 화면 위치 — 뷰어가 files/page/N.jpg 로 그린다 */
  function pageRect(n){
    var re = new RegExp('files/page/' + n + '\\.(jpg|jpeg|png|webp)', 'i');
    var best = null;
    var imgs = document.getElementsByTagName('img');
    for (var i=0;i<imgs.length;i++){
      var im = imgs[i];
      if (!re.test(im.getAttribute('src') || im.src || '')) continue;
      var r = im.getBoundingClientRect();
      if (r.width < 50 || r.height < 70) continue;
      if (!best || r.width*r.height > best.width*best.height) best = r;
    }
    return best;
  }

  /* 화면에 그려진 페이지 영역 — (예비) 가로세로비가 브로슈어와 같은 요소를 찾는다 */
  function pageBoxes(){
    var want = PW/PH, out = [];
    var els = document.body.querySelectorAll('canvas,img,div');
    for (var i=0;i<els.length;i++){
      var e = els[i];
      if (e === layer || e === dim || (layer && layer.contains(e)) || (dim && dim.contains(e))) continue;
      var r = e.getBoundingClientRect();
      if (r.width < 90 || r.height < 120) continue;
      if (r.bottom < 10 || r.top > innerHeight-10) continue;
      if (Math.abs(r.width / r.height - want) > 0.035) continue;
      if (r.width >= innerWidth - 6 && r.height >= innerHeight - 6) continue;   /* 화면 전체 컨테이너 제외 */
      out.push(r);
    }
    out.sort(function(a,b){ return a.left - b.left; });
    var keep = [];
    out.forEach(function(r){
      for (var i=0;i<keep.length;i++){
        var k = keep[i];
        if (Math.abs(k.left-r.left) < 20 && Math.abs(k.top-r.top) < 20){
          if (r.width > k.width) keep[i] = r;
          return;
        }
      }
      keep.push(r);
    });
    return keep;
  }

  var lastKey = '';
  function draw(){
    build();
    ensureCss();
    if (!document.body.contains(layer)){ document.body.appendChild(layer); lastKey=''; }
    if (!document.body.contains(dim))   document.body.appendChild(dim);
    if (!document.body.contains(fab))   document.body.appendChild(fab);

    var pages = currentPages();
    var boxes = pageBoxes();
    var key = JSON.stringify([pages, boxes.map(function(r){return [Math.round(r.left),Math.round(r.top),Math.round(r.width)];}),
      (pages||[]).map(function(pn){ var r=pageRect(pn); return r?[Math.round(r.left),Math.round(r.top),Math.round(r.width)]:0; })]);
    if (key === lastKey) return;
    lastKey = key;
    layer.innerHTML = '';
    fab.style.display = 'none';
    if (!pages) return;

    var rects = pages.map(function(pn, idx){ return pageRect(pn) || boxes[Math.min(idx, boxes.length-1)] || null; });
    if (rects.every(function(r){ return !!r; })){
      pages.forEach(function(pn, idx){
        var box = rects[idx];
        (BTN[pn] || []).forEach(function(b){
          var sx = box.width / PW, sy = box.height / PH;
          if (b.t === 'home' && !ICM_HOME) return;
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'icm-btn' + (b.t === 'home' ? ' icm-home' : '');
          if (b.t === 'home') btn.innerHTML = '전용 HomePage <b>&rsaquo;</b> <i>Click</i>';
          else btn.textContent = '상담요청';
          btn.style.left   = (box.left + b.x*sx) + 'px';
          btn.style.top    = (box.top  + b.y*sy) + 'px';
          btn.style.width  = (b.w*sx) + 'px';
          btn.style.height = (b.h*sy) + 'px';
          btn.style.fontSize     = Math.max(9, Math.round((b.fs||21)*sx*10)/10) + 'px';
          btn.style.borderRadius = Math.max(4, Math.round(9*sx)) + 'px';
          btn.onclick = (b.t === 'home')
            ? function(){ window.open(ICM_HOME, '_blank', 'noopener'); }
            : function(){ openForm(b.a); };
          tapBtn(btn);
          layer.appendChild(btn);
          fitText(btn);
        });
      });
      if (DEBUG) boxes.forEach(function(r){
        var d = document.createElement('div');
        d.style.cssText = 'position:absolute;border:2px dashed #C0392B;pointer-events:none;left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px;height:'+r.height+'px';
        layer.appendChild(d);
      });
    } else {
      var list = [];
      pages.forEach(function(pn){ (BTN[pn]||[]).forEach(function(b){ if (b.t !== 'home') list.push(b); }); });
      if (list.length){
        fab.textContent = list[0].a ? (list[0].a + ' 상담요청') : '상담요청';
        fab.onclick = function(){ openForm(list[0].a); };
        if (!fab._tap){ tapBtn(fab); fab._tap = 1; }
        fab.style.display = 'block';
      }
    }
  }

  /* 글자가 버튼 폭을 넘으면 맞을 때까지 줄인다 */
  function fitText(b){
    var fs = parseFloat(b.style.fontSize) || 12, n = 0;
    while (b.scrollWidth > b.clientWidth + 1 && fs > 6 && n++ < 30){
      fs -= 0.5; b.style.fontSize = fs + 'px';
    }
  }

  function tapBtn(b){
    var sx=0, sy=0, moved=false;
    b.addEventListener('touchstart', function(e){ e.stopPropagation(); var t=e.touches[0]; sx=t.clientX; sy=t.clientY; moved=false; }, {passive:true});
    b.addEventListener('touchmove',  function(e){ var t=e.touches[0]; if (Math.abs(t.clientX-sx)>10||Math.abs(t.clientY-sy)>10) moved=true; }, {passive:true});
    b.addEventListener('touchend',   function(e){ e.stopPropagation(); if (moved) return; e.preventDefault(); lastTouch=Date.now(); b.onclick && b.onclick(e); }, {passive:false});
    b.addEventListener('click',      function(e){ if (Date.now()-lastTouch < 700){ e.stopImmediatePropagation(); e.preventDefault(); } }, true);
  }

  function openForm(area){
    build();
    form.style.display = '';
    done.style.display = 'none';
    errBox.style.display = 'none';
    sel.selectedIndex = 0;
    if (area){ var i = AREAS.indexOf(area); if (i >= 0) sel.selectedIndex = i; }
    dim.style.display = 'flex';
    dim.style.top = ''; dim.style.height = ''; dim.style.bottom = '';
  }
  function closeForm(){ dim.style.display = 'none'; try{ document.activeElement && document.activeElement.blur(); }catch(_e){} }

  function err(msg){ errBox.textContent = msg; errBox.style.display = 'block'; try{ errBox.scrollIntoView({block:'center'}); }catch(_e){} }
  function esc(s){ var d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
  function $(id){ return document.getElementById(id); }

  async function send(){
    var btn  = $('icm-send');
    var name = $('icm-name').value.trim();
    var tel  = $('icm-tel').value.trim();
    var comp = $('icm-comp').value.trim();
    var memo = $('icm-memo').value.trim();
    var area = sel.value;
    errBox.style.display = 'none';
    if (!name) return err('성명을 입력해 주세요.');
    if (!/^0\d{1,2}-?\d{3,4}-?\d{4}$/.test(tel.replace(/\s/g,''))) return err('연락처를 정확히 입력해 주세요.');
    if (!$('icm-ok').checked) return err('개인정보 수집·이용에 동의해 주세요.');
    btn.disabled = true; btn.textContent = '전송 중…';
    try{
      if (ICM_API){
        var res = await fetch(ICM_API, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ memberId:MID, area:area, name:name, phone:tel, company:comp, memo:memo })
        });
        var js = await res.json().catch(function(){ return {}; });
        if (!res.ok || js.ok === false) throw new Error(js.message || '전송에 실패했습니다.');
      } else {
        await new Promise(function(r){ setTimeout(r, 600); });   /* 데모 모드 */
      }
      var now = new Date();
      recap.innerHTML =
        '<div><span>상담 분야</span><b>' + esc(area) + '</b></div>' +
        '<div><span>신청자</span><b>' + esc(name) + '</b></div>' +
        '<div><span>접수</span><b>' + (now.getMonth()+1) + '월 ' + now.getDate() + '일 ' +
        String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + '</b></div>';
      form.style.display = 'none';
      done.style.display = 'block';
      ['icm-name','icm-tel','icm-comp','icm-memo'].forEach(function(id){ $(id).value=''; });
      $('icm-ok').checked = false;
    }catch(e){
      err((e && e.message) || '전송에 실패했습니다. 잠시 후 다시 시도해 주세요.');
    }
    btn.disabled = false; btn.textContent = '신청하기';
  }

  function start(){
    build();
    if (/[?&]form=1/.test(location.search)) setTimeout(function(){ openForm(''); }, 1500);
    setInterval(draw, 400);
    addEventListener('resize', function(){ lastKey=''; draw(); });
    setTimeout(draw, 1500);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>
