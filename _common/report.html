<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ICM INSIGHT · 기업경영연구소</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;600;700&display=swap">
<!--
  ★ [2026-10-01] 브로슈어 리포트 — 고객용 화면 (PC·모바일 자동 전환)
  주소: ebook.icm.re.kr/{아이디}/report?r={리포트 id}[&c={맞춤 링크 코드}]   (_redirects 가 이 파일로 연결)
  · 서버 함수 brochureReport 로 게시중·지난 리포트만 받는다 (작성중·승인대기·반려 글은 열리지 않음)
  · 상담 신청은 브로슈어와 같은 brochureRequest 를 부른다 → 전문위원 알림톡·고객 접수 안내 흐름 동일
  · 화면 폭 1024px 이상은 PC형(본문 + 따라오는 사이드바), 그 아래는 모바일형(3줄 요약 카드 + 하단 고정 상담 버튼)
  · ?preview=1 : 이너 Platform 작성 화면의 미리보기 — 서버를 부르지 않고 부모 창(자비아)이 보낸 내용만 그린다
  · 고객 화면이므로 자비아·이너서클·한국FP센터 표기를 쓰지 않는다
-->
<style>
:root{--ink:#2A231D;--ink0:#241E19;--ink2:#3B332C;--gold:#D9BE87;--gold2:#B8965A;--gold3:#7A5C2C;--cream:#F5EFE6;--paper:#F4ECDF;--line:#E3D8C6;--line2:#D9CCB6;--mut:#5E5145;--mut2:#6B5E51;--sub:#D8CDBD;--sub2:#BFB2A0}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:'Noto Sans KR',-apple-system,'Malgun Gothic',sans-serif;background:var(--cream);color:var(--ink);word-break:keep-all;overflow-wrap:break-word}
a{color:inherit}
button{font-family:inherit}
.sf{font-family:'Noto Serif KR','Nanum Myeongjo',Georgia,serif}
.wrap{width:100%;max-width:1120px;margin:0 auto}
.only-pc{display:none!important}

/* 상단 바 + 읽기 진행선 */
.tb{position:sticky;top:0;z-index:20;background:var(--ink0);border-bottom:1px solid rgba(217,190,135,.25);padding-top:env(safe-area-inset-top,0px)}
.tb .in{height:56px;padding:0 8px;display:flex;align-items:center;justify-content:space-between}
.tb .bk{display:inline-flex;align-items:center;gap:4px;height:44px;padding:0 8px;color:var(--gold);font-size:14px;text-decoration:none}
.tb .lg{display:flex;align-items:center;gap:9px;color:var(--gold)}
.tb .lg .mk-svg{width:26px;height:26px;flex-shrink:0}
.tb .lg span{display:flex;flex-direction:column;line-height:1.2}
.tb .lg b{font-size:14px;color:var(--paper);letter-spacing:1px}
.tb .lg small{font-size:7.5px;color:var(--sub2);letter-spacing:.14em;margin-top:2px}
@media(max-width:379px){.tb .lg small{display:none}}
.tb .sh{width:44px;height:44px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:var(--gold);font-size:13px}
.tb .sh span{display:none}
.pg{height:3px;background:var(--ink)}
.pg i{display:block;height:3px;width:0;background:var(--gold);transition:width .1s linear}

/* 머리 영역 */
.hero{background:radial-gradient(ellipse 90% 80% at 100% 0%,#3E342B 0%,var(--ink) 65%);padding:38px 24px 30px}
.hero.ov{padding-bottom:64px}
.hero .lb{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hero .lb i{width:24px;height:1px;background:var(--gold)}
.hero .lb b{font-size:11.5px;font-weight:700;letter-spacing:.32em;color:var(--gold)}
.hero .lb span{font-size:12px;color:var(--sub2);padding:2px 9px;border:1px solid rgba(217,190,135,.35);border-radius:11px}
.hero h1{font-size:30px;font-weight:700;line-height:1.38;color:var(--paper);letter-spacing:-.025em;margin:16px 0 14px}
.hero .sm{font-size:15.5px;line-height:1.75;color:var(--sub)}
.au{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:20px;padding-top:16px;border-top:1px solid rgba(217,190,135,.25)}
.au .av{width:42px;height:42px;border-radius:50%;background:var(--gold);color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;flex-shrink:0}
.au b{display:block;font-size:14px;color:var(--paper)}
.au span{display:block;font-size:12px;color:var(--sub2);margin-top:2px}
.au .org{display:none}

/* 3줄 요약 */
.sum{background:#fff;border-radius:12px;padding:20px 20px 18px}
.sum>b{display:block;font-size:12px;font-weight:700;letter-spacing:.24em;color:var(--gold3);margin-bottom:12px}
.sum div{display:grid;grid-template-columns:22px 1fr;gap:4px;font-size:14.5px;line-height:1.6;padding:4px 0}
.sum div em{font-style:normal;font-weight:700;color:var(--gold2)}
.sum.m{margin:-36px 18px 0;position:relative;z-index:2;box-shadow:0 12px 30px rgba(42,35,29,.14)}
.sum.p{border:1px solid var(--line);border-radius:10px;padding:24px}

/* 본문 */
.grid{padding:40px 24px 0}
.art{display:flex;flex-direction:column;gap:40px}
.sc .no{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.sc .no em{font-style:normal;font-size:34px;font-weight:600;line-height:1;color:var(--gold2)}
.sc .no i{flex:1;height:1px;background:#DCCFB9}
.sc h2{font-size:21px;font-weight:700;line-height:1.45;margin-bottom:12px}
.sc p{font-size:16px;line-height:1.9;color:var(--ink2);white-space:pre-wrap}
.qt{margin:0;padding:30px 4px 26px;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);text-align:center;position:relative}
.qt .mk{display:block;font-size:64px;line-height:.6;height:32px;color:var(--gold)}
.qt blockquote{font-size:22px;font-weight:600;line-height:1.6;color:var(--ink)}
.qt figcaption{display:none}

/* 상담·전문위원 카드 */
.ct{background:var(--ink);border-radius:12px;padding:26px 22px;display:flex;flex-direction:column;gap:12px}
.ct h3{font-size:21px;font-weight:700;line-height:1.45;color:var(--paper)}
.ct p{font-size:14px;line-height:1.7;color:var(--sub)}
.ct .b1{height:52px;border:none;border-radius:8px;background:var(--gold);color:#231D17;font-size:16px;font-weight:700;cursor:pointer}
.ct .b2{height:48px;border:1px solid rgba(217,190,135,.55);border-radius:8px;background:transparent;color:var(--gold);font-size:15px;cursor:pointer}
.ct.m{margin:40px 18px 0}
.ac{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.ac b{display:block;font-size:15px}
.ac span{display:block;font-size:12.5px;color:var(--mut);margin-top:3px}
.ac a{height:44px;display:flex;align-items:center;font-size:13.5px;font-weight:700;color:var(--gold3);text-decoration:none;white-space:nowrap}
.ac.m{margin:16px 18px 0}

/* 이전 리포트 */
.pv{margin:34px 24px 0}
.pv>b{display:block;font-size:12px;font-weight:700;letter-spacing:.24em;color:var(--gold3);padding-bottom:8px}
.pv .ls a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0;border-top:1px solid var(--line);text-decoration:none}
.pv .ls a:last-child{border-bottom:1px solid var(--line)}
.pv .ls a span{font-size:15.5px;font-weight:600;line-height:1.5}
.pv .ls a small{font-size:12px;color:var(--mut2);flex-shrink:0}

.ft{margin-top:36px;padding:24px 24px 30px;background:#E9E0D2;font-size:12px;line-height:1.7;color:var(--mut)}
.ft .in b{display:block;font-size:13px;color:var(--ink2);margin-bottom:4px}

/* 모바일 하단 고정 상담 버튼 */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:rgba(245,239,230,.96);border-top:1px solid var(--line);display:flex;gap:10px;transform:translateY(110%);transition:transform .25s ease}
.bar.on{transform:none}
.bar .b1{flex:1;height:52px;border:none;border-radius:10px;background:var(--ink);color:var(--gold);font-size:16px;font-weight:700;cursor:pointer}
.bar .b2{width:52px;height:52px;border:1px solid #CDBFA8;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
body.hasbar .ft{padding-bottom:110px}

.msg{padding:120px 28px;text-align:center;color:var(--mut);font-size:15px;line-height:1.7}
.msg a{display:inline-flex;margin-top:18px;height:46px;align-items:center;padding:0 22px;border-radius:8px;background:var(--ink);color:var(--gold);text-decoration:none;font-weight:700}
.tst{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(20,16,12,.9);color:#fff;font-size:14px;padding:11px 18px;border-radius:22px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;white-space:nowrap}
.tst.on{opacity:1}
body.pre .tb .bk,body.pre .pv a,body.pre .ac a{pointer-events:none}

.au .av{overflow:hidden}
.au .av img{width:100%;height:100%;object-fit:cover;display:block}
.nw{display:inline-flex;align-items:center;gap:7px;height:40px;margin-top:14px;padding:0 16px;border:1px solid rgba(217,190,135,.6);border-radius:20px;color:var(--gold);font-size:13px;font-weight:500;letter-spacing:.02em;text-decoration:none;white-space:nowrap}
.nw:hover{background:rgba(217,190,135,.1)}
.nw svg{flex-shrink:0}
.endm{display:flex;align-items:center;gap:14px;color:var(--gold2);margin-top:-8px}
.endm i{flex:1;height:1px;background:var(--line2)}
.endm .mk-svg{width:26px;height:26px}
/* 공유 창 — 브로슈어 공유 창과 같은 모양 */
.shd{position:fixed;inset:0;z-index:55;background:rgba(20,16,12,.55);display:none;align-items:flex-end;justify-content:center}
.shd.on{display:flex}
.shb{width:100%;max-width:440px;background:#fff;border-radius:20px 20px 0 0;padding:22px 20px calc(18px + env(safe-area-inset-bottom,0px))}
.shb h3{font-size:18px;font-weight:700;color:#231D17}
.shb p{font-size:13.5px;color:#7A6F64;margin:4px 0 16px}
.shg{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:10px}
.shg button{min-height:84px;border:1px solid #E5DED3;border-radius:12px;background:#FAF8F5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:14px;color:#3B332C;cursor:pointer}
.shg button svg{width:24px;height:24px}
.shc{width:100%;height:48px;margin-top:10px;border:none;border-radius:12px;background:#F0EBE3;color:#5E5145;font-size:15px;cursor:pointer}
@media (min-width:640px){.shd{align-items:center}.shb{border-radius:16px}}

/* ═══ PC (1024px 이상) — 매거진형: 큰 제목 + 본문 / 따라오는 사이드바 ═══ */
@media (min-width:1024px){
  .only-pc{display:flex!important}
  .only-m{display:none!important}
  .tb .in{height:64px;padding:0 40px}
  .tb .lg{gap:11px}
  .tb .lg .mk-svg{width:32px;height:32px}
  .tb .lg b{font-size:16px;letter-spacing:1.5px}
  .tb .lg small{font-size:9.5px;letter-spacing:.18em}
  .tb .bk{padding:0}
  .tb .sh{width:auto;height:40px;padding:0 16px;border:1px solid rgba(217,190,135,.5);border-radius:20px}
  .tb .sh span{display:inline}
  .hero,.hero.ov{background:radial-gradient(ellipse 70% 120% at 85% 0%,#3E342B 0%,var(--ink) 60%);padding:88px 40px 80px}
  .hero .hg{display:grid;grid-template-columns:1fr 300px;gap:80px;align-items:end}
  .hero .lb{gap:14px}.hero .lb i{width:36px}.hero .lb b{font-size:13px}.hero .lb span{font-size:13px;padding:3px 10px}
  .hero h1{font-size:50px;line-height:1.3;letter-spacing:-.03em;margin:22px 0 22px}
  .hero .sm{font-size:19px;max-width:640px}
  .au{margin-top:0;padding-top:22px;border-top:1px solid rgba(217,190,135,.35);flex-wrap:wrap}
  .au .av{width:56px;height:56px;font-size:22px}
  .au b{font-size:16px}
  .au .org{display:block}
  .au .dt{flex-basis:100%;font-size:13px;color:var(--sub2);margin-top:14px}
  .au .nw{margin-top:16px}
  .endm{margin-top:-16px}
  .endm .mk-svg{width:30px;height:30px}
  .grid{padding:72px 40px 0;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:80px;align-items:start;max-width:1200px;margin:0 auto}
  .art{gap:56px;max-width:700px}
  .sc{display:grid;grid-template-columns:76px 1fr;gap:8px}
  .sc .no{display:block;margin:0}
  .sc .no em{font-size:52px}
  .sc .no i{display:none}
  .sc .tx{padding-top:6px}
  .sc h2{font-size:27px;line-height:1.4;margin-bottom:18px}
  .sc p{font-size:18px;line-height:1.95}
  .qt{padding:40px 0 36px 76px;text-align:left}
  .qt .mk{position:absolute;left:0;top:22px;font-size:96px;line-height:1;height:auto}
  .qt blockquote{font-size:30px;line-height:1.55;letter-spacing:-.02em}
  .qt figcaption{display:block;margin-top:14px;font-size:14px;color:var(--mut2)}
  aside.only-pc{flex-direction:column;gap:18px;position:sticky;top:92px}
  .ct{border-radius:10px;padding:26px 24px}
  .ac{border-radius:10px;padding:20px 24px;flex-direction:column;align-items:flex-start;gap:4px}
  .ac a{margin-top:6px}
  .pv{margin:88px auto 0;max-width:1120px;padding:0 0}
  .pv>b{font-size:13px;padding-bottom:18px}
  .pv .ls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
  .pv .ls a,.pv .ls a:last-child{flex-direction:column-reverse;align-items:flex-start;justify-content:flex-end;gap:10px;padding:22px;border:1px solid var(--line);border-radius:10px;background:#fff}
  .pv .ls a span{font-size:18px;font-weight:700}
  .ft{margin-top:88px;padding:36px 40px 44px}
  .ft .in{max-width:1120px;margin:0 auto;display:flex;justify-content:space-between;gap:40px;font-size:13px}
  .ft .in b{margin:0;flex-shrink:0}
  .ft .in span{max-width:720px}
  .bar{display:none}
  body.hasbar .ft{padding-bottom:44px}
  .tst{bottom:40px}
}
@media (min-width:1024px) and (max-width:1199px){
  .hero .hg{gap:48px}.grid{gap:48px}
  .hero h1{font-size:42px}
}

/* 상담 신청 — 브로슈어와 같은 항목·문구 */
.dim{position:fixed;inset:0;z-index:50;background:rgba(20,16,12,.55);display:none;align-items:flex-end;justify-content:center}
.dim.on{display:flex}
.md{width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow-y:auto;background:#fff;border-radius:22px 22px 0 0;padding:24px 22px calc(22px + env(safe-area-inset-bottom,0px));position:relative}
@media (min-width:640px){.dim{align-items:center}.md{border-radius:18px}}
.md h3{font-size:21px;font-weight:700;color:#231D17}
.md .sub{font-size:13.5px;color:#7A6F64;margin:6px 0 18px}
.md .x{position:absolute;right:12px;top:12px;width:44px;height:44px;border:none;background:none;font-size:26px;color:#5E5145;cursor:pointer}
.fl{margin-bottom:14px}
.fl label{display:block;font-size:14px;font-weight:700;color:#3B332C;margin-bottom:7px}
.fl label i{font-style:normal;font-weight:400;color:#8B7F70}
.fl input,.fl select,.fl textarea{width:100%;height:50px;border:1px solid #DCD3C6;border-radius:10px;background:#FAF8F5;padding:0 14px;font-size:16px;font-family:inherit;color:#231D17}
.fl textarea{height:90px;padding:12px 14px;resize:none;line-height:1.6}
.fl input:focus,.fl select:focus,.fl textarea:focus{outline:none;border-color:var(--gold2);background:#fff}
.rw{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ag{display:flex;gap:10px;align-items:flex-start;background:#F3F0EB;border-radius:10px;padding:14px;margin:4px 0 12px;font-size:13px;line-height:1.6;color:#5E5145}
.ag input{width:22px;height:22px;flex-shrink:0;margin-top:1px;accent-color:#3A332C}
.er{display:none;color:#A93B33;font-size:13.5px;margin-bottom:10px}
.go{width:100%;height:54px;border:none;border-radius:12px;background:#3A332C;color:var(--gold);font-size:17px;font-weight:700;cursor:pointer}
.go:disabled{opacity:.6}
.dn{display:none;text-align:center;padding:10px 0 4px}
.dn .ok{width:56px;height:56px;border-radius:50%;background:#3A332C;color:var(--gold);font-size:28px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.dn p{font-size:14.5px;line-height:1.7;color:#5E5145;margin:10px 0 18px}
@media(max-width:380px){.hero h1{font-size:27px}.rw{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="tb">
  <div class="in">
    <a class="bk" id="bk" href="#"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D9BE87" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg><span class="only-m">브로슈어</span><span class="only-pc">브로슈어로 돌아가기</span></a>
    <div class="lg"><svg class="mk-svg" viewBox="0 0 100 98" aria-hidden="true"><path fill="currentColor" d="M43.8,82.5L28.5,97.7H43.8Z M43.8,55.6L2,97.7H17.6L43.8,71.3Z M43.8,29.4L0,73V88L43.8,45.6Z M50.6,0L62.2,10.2V97.7H50.6Z M68.9,17L80.7,27.7V97.7H68.9Z M88.2,34.6L99.8,45.3V97.7H88.2Z"/></svg><span><b>기업경영연구소</b><small>INSTITUTE FOR CORPORATE MANAGEMENT</small></span></div>
    <button class="sh" id="sh" type="button" aria-label="리포트 공유"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D9BE87" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg><span>공유</span></button>
  </div>
  <div class="pg"><i id="pgb"></i></div>
</div>
<main id="main"><div class="msg">리포트를 불러오는 중입니다…</div></main>

<div class="bar only-m" id="bar">
  <button class="b1" type="button" id="bar-c">이 주제로 상담 신청</button>
  <button class="b2" type="button" id="bar-s" aria-label="리포트 공유"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5C4420" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg></button>
</div>

<div class="shd" id="shd" role="dialog" aria-modal="true" aria-label="리포트 공유">
  <div class="shb">
    <h3>이 리포트 공유하기</h3>
    <p>지인 대표님께 전달해 보세요</p>
    <div class="shg" id="shg"></div>
    <button class="shc" type="button" id="shx">닫기</button>
  </div>
</div>
<div class="dim" id="dim" role="dialog" aria-modal="true" aria-label="전문가 상담 신청">
  <div class="md">
    <button class="x" type="button" id="mx" aria-label="닫기">&times;</button>
    <div id="fm">
      <h3>전문가 상담 신청</h3>
      <p class="sub">남겨주신 정보는 담당 전문위원에게 바로 전달됩니다</p>
      <div class="fl"><label for="f-area">상담 분야</label><select id="f-area"></select></div>
      <div class="rw">
        <div class="fl"><label for="f-name">성명</label><input id="f-name" type="text" maxlength="20" placeholder="홍길동" autocomplete="name"></div>
        <div class="fl"><label for="f-tel">연락처</label><input id="f-tel" type="tel" maxlength="20" placeholder="010-0000-0000" autocomplete="tel"></div>
      </div>
      <div class="fl"><label for="f-comp">회사명 <i>(선택)</i></label><input id="f-comp" type="text" maxlength="40" placeholder="(주)대한산업" autocomplete="organization"></div>
      <div class="fl"><label for="f-memo">문의 내용 <i>(선택)</i></label><textarea id="f-memo" maxlength="300" placeholder="궁금한 점을 간단히 적어주세요"></textarea></div>
      <div class="ag"><input id="f-ok" type="checkbox"><label for="f-ok">상담 연락을 위한 <b>개인정보 수집·이용</b>에 동의합니다. 수집 항목은 성명·연락처·회사명·문의내용이며, 상담 종료 후 지체 없이 파기합니다.</label></div>
      <div class="er" id="f-er"></div>
      <button class="go" id="f-go" type="button">신청하기</button>
    </div>
    <div class="dn" id="dn">
      <div class="ok">&#10003;</div>
      <h3>신청이 접수되었습니다</h3>
      <p>담당 전문위원에게 전달되었습니다.<br>영업일 기준 1일 이내에 연락드립니다.</p>
      <button class="go" type="button" id="dn-go">리포트 계속 보기</button>
    </div>
  </div>
</div>
<div class="tst" id="tst"></div>

<script>
(function(){
  'use strict';
  var API = 'https://asia-northeast3-jarvia-platform.cloudfunctions.net/';
  var AREAS = ['세무','관세','법률','특허','M&A','기업신용평가','부동산','감정평가','법무·행정','비용절감','기업금융','기업인증·R&D','노무',
               '경영컨설팅·자산관리','법정의무교육·기업교육','의료·건강','기타'];   /* 서버 BROCHURE_AREAS 와 같은 목록 */
  /* 미리보기 내용을 보낼 수 있는 곳 — 자비아(이너 Platform)만 */
  var PREVIEW_FROM = /^https:\/\/((www\.)?jarvia\.co\.kr|jarvaai\.web\.app|jarvia-platform\.web\.app|jarvia-platform\.firebaseapp\.com)$|^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/;
  function $(id){ return document.getElementById(id); }
  function esc(s){ var d=document.createElement('div'); d.textContent = (s==null?'':String(s)); return d.innerHTML; }
  function toast(m){ var t=$('tst'); t.textContent=m; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove('on'); }, 2400); }

  var Q = new URLSearchParams(location.search);
  var PRE = Q.get('preview') === '1';
  var seg = location.pathname.split('/').filter(Boolean);
  var MID = (!PRE && seg.length > 1) ? decodeURIComponent(seg[0]) : '';
  var RID = Q.get('r') || '', CODE = Q.get('c') || '';
  if (!/^[A-Za-z0-9]{6,12}$/.test(CODE)) CODE = '';   /* 브로슈어 맞춤 링크 코드와 같은 형식만 */
  var base = '/' + encodeURIComponent(MID) + '/';
  var keep = CODE ? 'c=' + encodeURIComponent(CODE) + (Q.get('f') === '1' ? '&f=1' : '') : '';   /* 브로슈어로 돌아갈 때 맞춤 링크(공유 여부 포함)를 그대로 */
  var BACK = base + (keep ? '?' + keep : '');
  $('bk').href = BACK;
  var REP = null;
  if (PRE) document.body.classList.add('pre');

  async function callFn(name, data){
    var res = await fetch(API + name, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ data: data }) });
    var js = await res.json().catch(function(){ return {}; });
    if (!res.ok || js.error) throw new Error((js.error && js.error.message) || '서버 오류');
    return js.result || {};
  }

  function fail(m){
    $('main').innerHTML = '<div class="msg">' + esc(m || '리포트를 찾을 수 없습니다.') + '<br><a href="' + esc(BACK) + '">브로슈어 보기</a></div>';
  }

  function render(r){
    var rep = r.report || {}, au = r.author || {}, name = String(au.name || '');
    REP = rep;
    document.title = (rep.title || 'ICM INSIGHT') + ' · ICM INSIGHT';
    var secs = (rep.sections || []).filter(function(s){ return s && (s.h || s.b); });
    var keys = (rep.keys || []).filter(Boolean);
    var chars = secs.reduce(function(n, s){ return n + String(s.b || '').length; }, String(rep.summary || '').length);
    var mins = Math.max(1, Math.round(chars / 500));
    var dt = (rep.date ? esc(rep.date) + ' · ' : '') + '읽는 데 약 ' + mins + '분';
    var ini = /^https:\/\//i.test(au.photoUrl || '') ? '<img src="' + esc(au.photoUrl) + '" alt="">' : esc(name.slice(0,1) || '·');
    var nwUrl = /^https?:\/\//i.test(au.networkUrl || '') ? au.networkUrl : '';
    var nwHtml = nwUrl ? '<a class="nw" href="' + esc(nwUrl) + '" target="_blank" rel="noopener">전문가 네트워크 홈페이지<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg></a>' : '';
    var home = /^https?:\/\//i.test(au.homeUrl || '') ? au.homeUrl : '';
    var sumHtml = function(cls){
      return keys.length ? '<div class="sum ' + cls + '"><b>' + (keys.length === 3 ? '3줄 요약' : '핵심 요약') + '</b>'
        + keys.map(function(k, i){ return '<div><em class="sf">' + (i+1) + '</em><span>' + esc(k) + '</span></div>'; }).join('') + '</div>' : '';
    };
    var ctHtml = function(cls){
      return '<div class="ct ' + cls + '"><h3 class="sf">이 주제로 상담이 필요하신가요?</h3><p>세무·법률·노무 분야 전문가 그룹과 함께 대표님 회사에 맞는 방법을 찾아드립니다.</p>'
        + '<button class="b1 js-c" type="button">상담 신청하기</button><button class="b2 js-s" type="button">지인 대표님께 공유하기</button></div>';
    };
    var acHtml = function(cls){
      return '<div class="ac ' + cls + '"><div><b>' + esc(name) + ' 전문위원</b><span>ICM 기업경영연구소 · 경영컨설팅 부문</span></div>'
        + (home ? '<a href="' + esc(home) + '" target="_blank" rel="noopener">컨설턴트 홈페이지 ›</a>' : '<a href="' + esc(BACK) + '">브로슈어 보기 ›</a>') + '</div>';
    };
    var h = '';
    h += '<section class="hero' + (keys.length ? ' ov' : '') + '"><div class="wrap hg"><div>'
      + '<div class="lb"><i></i><b>ICM INSIGHT</b>' + (rep.topic ? '<span>' + esc(rep.topic) + '</span>' : '') + '</div>'
      + '<h1 class="sf">' + esc(rep.title || '') + '</h1>' + (rep.summary ? '<p class="sm">' + esc(rep.summary) + '</p>' : '') + '</div>'
      + '<div class="au"><span class="av sf">' + ini + '</span><div><b>' + esc(name) + ' 전문위원</b><span class="org">ICM 기업경영연구소 · 경영컨설팅 부문</span><span class="only-m">' + dt + '</span></div><span class="dt only-pc">' + dt + '</span>' + (nwHtml ? '<div style="flex-basis:100%">' + nwHtml + '</div>' : '') + '</div>'
      + '</div></section>';
    h += sumHtml('m only-m');
    h += '<div class="grid"><article class="art">';
    secs.forEach(function(s, i){
      h += '<section class="sc"><div class="no"><em class="sf">' + String(i+1).padStart(2,'0') + '</em><i></i></div><div class="tx"><h2 class="sf">' + esc(s.h) + '</h2><p>' + esc(s.b) + '</p></div></section>';
      if (i === 1 && rep.quote) h += quoteHtml(rep.quote, name);
    });
    if (secs.length < 2 && rep.quote) h += quoteHtml(rep.quote, name);
    h += '<div class="endm" aria-hidden="true"><i></i><svg class=\"mk-svg\" viewBox=\"0 0 100 98\" aria-hidden=\"true\"><path fill=\"currentColor\" d=\"M43.8,82.5L28.5,97.7H43.8Z M43.8,55.6L2,97.7H17.6L43.8,71.3Z M43.8,29.4L0,73V88L43.8,45.6Z M50.6,0L62.2,10.2V97.7H50.6Z M68.9,17L80.7,27.7V97.7H68.9Z M88.2,34.6L99.8,45.3V97.7H88.2Z\"/></svg><i></i></div>';
    h += '</article><aside class="only-pc">' + sumHtml('p') + ctHtml('') + acHtml('') + '</aside></div>';
    h += ctHtml('m only-m') + acHtml('m only-m');
    if ((r.prev || []).length){
      h += '<section class="pv"><b>이전 리포트</b><div class="ls">' + r.prev.map(function(p){
        return '<a href="' + base + 'report?r=' + encodeURIComponent(p.id) + (keep ? '&' + keep : '') + '"><span class="sf">' + esc(p.title) + '</span><small>' + esc(p.month || '') + '</small></a>';
      }).join('') + '</div></section>';
    }
    h += '<footer class="ft"><div class="in"><b>ICM 기업경영연구소</b><span>본 리포트는 일반적인 정보 제공을 위한 자료이며, 개별 기업의 상황에 대한 세무·법률 자문이 아닙니다. 구체적인 판단은 상담을 통해 확인하시기 바랍니다.</span></div></footer>';
    $('main').innerHTML = h;
    Array.prototype.forEach.call(document.querySelectorAll('.js-c'), function(b){ b.onclick = openForm; });
    Array.prototype.forEach.call(document.querySelectorAll('.js-s'), function(b){ b.onclick = share; });
    document.body.classList.add('hasbar');
    onScroll();
  }
  function quoteHtml(q, name){
    return '<figure class="qt"><span class="mk sf" aria-hidden="true">“</span><blockquote class="sf">' + esc(q) + '</blockquote>'
      + (name ? '<figcaption>— ' + esc(name) + ' 전문위원</figcaption>' : '') + '</figure>';
  }

  /* 읽기 진행선 · 모바일 하단 상담 버튼(머리 영역을 지나면 나타남) */
  function onScroll(){
    var d = document.documentElement, max = d.scrollHeight - d.clientHeight;
    $('pgb').style.width = (max > 0 ? Math.min(100, Math.max(0, d.scrollTop / max * 100)) : 0) + '%';
    var hero = document.querySelector('.hero');
    $('bar').classList.toggle('on', !!hero && hero.getBoundingClientRect().bottom < 0 && !$('dim').classList.contains('on') && !$('shd').classList.contains('on'));
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);

  /* 공유 — 자체 공유 창. 받은 분이 열어도 같은 리포트. 맞춤 링크 코드(c)는 넘기지 않는다(받은 분의 열람이 보낸 분 기록에 섞이지 않게)
     · 폰: 앱으로 보내기(카카오톡 등) · 링크 복사 · 문자 / PC: 링크 복사 (PC 기본 공유창은 보낼 앱이 없어 오류가 나므로 쓰지 않음) */
  var IC = {
    app:'<svg viewBox="0 0 24 24" fill="none" stroke="#7A5C2C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>',
    link:'<svg viewBox="0 0 24 24" fill="none" stroke="#7A5C2C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>',
    sms:'<svg viewBox="0 0 24 24" fill="none" stroke="#7A5C2C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>'
  };
  function shareUrl(){ return location.origin + base + 'report?r=' + encodeURIComponent(RID); }
  function shareText(){ return (REP ? REP.title : 'ICM INSIGHT') + ' — ICM 기업경영연구소'; }
  function share(){
    if (PRE){ toast('미리보기에서는 공유되지 않습니다'); return; }
    var mobile = window.matchMedia && window.matchMedia('(pointer:coarse)').matches;
    var g = $('shg'), h = '';
    if (mobile && navigator.share) h += '<button type="button" data-k="app">' + IC.app + '앱으로 보내기</button>';
    h += '<button type="button" data-k="link">' + IC.link + '링크 복사</button>';
    if (mobile) h += '<button type="button" data-k="sms">' + IC.sms + '문자</button>';
    g.innerHTML = h;
    Array.prototype.forEach.call(g.querySelectorAll('button'), function(b){ b.onclick = function(){ shareDo(b.getAttribute('data-k')); }; });
    $('shd').classList.add('on'); onScroll();
  }
  function shareClose(){ $('shd').classList.remove('on'); onScroll(); }
  async function shareDo(k){
    var url = shareUrl(), text = shareText();
    if (k === 'app'){
      try{ await navigator.share({ title: REP ? REP.title : 'ICM INSIGHT', text: text, url: url }); shareClose(); }
      catch(e){ if (!e || e.name !== 'AbortError') toast('앱 공유를 열지 못했습니다. 링크 복사를 이용해 주세요.'); }
      return;
    }
    if (k === 'sms'){ location.href = 'sms:?&body=' + encodeURIComponent(text + '\n' + url); shareClose(); return; }
    var ok = false;
    try{ await navigator.clipboard.writeText(url); ok = true; }catch(_){
      try{ var ta = document.createElement('textarea'); ta.value = url; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); document.body.removeChild(ta); }catch(_e){}
    }
    if (ok){ shareClose(); toast('링크를 복사했습니다. 메시지에 붙여 넣어 보내세요.'); }
    else prompt('아래 링크를 복사해 보내세요', url);
  }
  $('shx').onclick = shareClose;
  $('shd').addEventListener('click', function(e){ if (e.target === $('shd')) shareClose(); });

  /* 상담 신청 — 브로슈어 상담 팝업과 같은 항목·검사·서버 함수 */
  function openForm(){
    if (PRE){ toast('미리보기에서는 상담 신청이 열리지 않습니다'); return; }
    var sel = $('f-area');
    if (!sel.options.length){
      sel.innerHTML = '<option value="">상담 분야를 선택해 주세요</option>' + AREAS.map(function(a){ return '<option>' + esc(a) + '</option>'; }).join('');
    }
    if (REP && AREAS.indexOf(REP.topic) >= 0) sel.value = REP.topic;
    if (REP && !$('f-memo').value) $('f-memo').value = '「' + REP.title + '」 리포트를 보고 문의드립니다.';
    $('fm').style.display = ''; $('dn').style.display = 'none'; $('f-er').style.display = 'none';
    $('dim').classList.add('on'); onScroll();
  }
  function closeForm(){ $('dim').classList.remove('on'); onScroll(); }
  function err(m){ var e=$('f-er'); e.textContent=m; e.style.display='block'; }
  async function send(){
    var area = $('f-area').value, name = $('f-name').value.trim(), tel = $('f-tel').value.trim(),
        comp = $('f-comp').value.trim(), memo = $('f-memo').value.trim();
    $('f-er').style.display = 'none';
    if (!area) return err('상담 분야를 선택해 주세요.');
    if (!name) return err('성명을 입력해 주세요.');
    if (!/^0\d{1,2}-?\d{3,4}-?\d{4}$/.test(tel.replace(/\s/g,''))) return err('연락처를 정확히 입력해 주세요.');
    if (!$('f-ok').checked) return err('개인정보 수집·이용에 동의해 주세요.');
    var b = $('f-go'); b.disabled = true; b.textContent = '전송 중…';
    try{
      var r = await callFn('brochureRequest', { id: MID, c: CODE, area: area, name: name, phone: tel, company: comp, memo: memo, agree: true });
      if (!r || r.ok !== true) throw new Error((r && r.message) || '전송에 실패했습니다.');
      $('fm').style.display = 'none'; $('dn').style.display = 'block';
      ['f-name','f-tel','f-comp','f-memo'].forEach(function(id){ $(id).value = ''; }); $('f-ok').checked = false;
    }catch(e){ err((e && e.message) || '전송에 실패했습니다. 잠시 후 다시 시도해 주세요.'); }
    b.disabled = false; b.textContent = '신청하기';
  }
  $('f-go').onclick = send; $('mx').onclick = closeForm; $('dn-go').onclick = closeForm;
  $('dim').addEventListener('click', function(e){ if (e.target === $('dim')) closeForm(); });
  $('sh').onclick = share; $('bar-s').onclick = share; $('bar-c').onclick = openForm;

  /* 미리보기 — 자비아 이너 Platform 이 보낸 내용만 그린다(서버 호출 없음) */
  if (PRE){
    window.addEventListener('message', function(e){
      if (!PREVIEW_FROM.test(e.origin) || !e.data || e.data.type !== 'icm-report-preview' || !e.data.data) return;
      render(e.data.data);
    });
    try { window.parent.postMessage({ type: 'icm-report-ready' }, '*'); } catch(_){}
    return;
  }
  if (!MID || !RID){ fail(); return; }
  callFn('brochureReport', { id: MID, r: RID }).then(function(r){
    if (!r || r.ok !== true || !r.report) return fail(r && r.message);
    render(r);
  }).catch(function(){ fail('잠시 후 다시 시도해 주세요.'); });
})();
</script>
</body>
</html>
